name: Jenkinsfile conversion

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  APP_ENV: ci

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - name: Verify jq
        run: jq --version
      - name: Build
        run: ./gradlew --no-daemon clean build
      - name: Transfer build outputs to dependent jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          if-no-files-found: error

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - name: Restore build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
      - name: Unit Tests
        id: unit_tests
        run: ./gradlew --no-daemon test
      - name: Publish JUnit results
        if: ${{ always() && steps.unit_tests.outcome != 'skipped' }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/test/*.xml
          fail_on_failure: true
          require_tests: true

  lint:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - name: Restore build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
      - name: Lint
        run: ./gradlew --no-daemon check

  publish-artifacts:
    needs: [unit-tests, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Publish Artifacts
        run: echo 'Publishing artifacts (placeholder)'

  archive-artifacts:
    needs: [build, unit-tests, lint, publish-artifacts]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Restore build outputs when available
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
          if-no-artifact-found: warn
      - name: Archive JAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-jars
          path: build/libs/*.jar
          if-no-files-found: error
