name: Jenkinsfile conversion

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  APP_ENV: ci

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_artifact_url: ${{ steps.upload_build.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools and Build
        run: |
          docker run --rm --user root \
            -e APP_ENV \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint sh \
            gradle:8.7.0-jdk17-alpine \
            -c 'apk add --no-cache bash git jq && jq --version && ./gradlew --no-daemon clean build'
      - name: Transfer build outputs to dependent jobs
        id: upload_build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          if-no-files-found: warn

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      jars_artifact_url: ${{ steps.upload_unit_jars.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
      - name: Unit Tests
        id: unit_tests
        run: |
          docker run --rm --user root \
            -e APP_ENV \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint sh \
            gradle:8.7.0-jdk17-alpine \
            -c 'apk add --no-cache bash git jq && ./gradlew --no-daemon test'
      - name: Publish JUnit results
        if: ${{ always() && steps.unit_tests.outcome != 'skipped' }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/test/*.xml
          fail_on_failure: true
          require_tests: true
      - name: Transfer JAR outputs for final archive
        id: upload_unit_jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-jars
          path: build/libs/
          if-no-files-found: warn

  lint:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      jars_artifact_url: ${{ steps.upload_lint_jars.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
      - name: Lint
        run: |
          docker run --rm --user root \
            -e APP_ENV \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint sh \
            gradle:8.7.0-jdk17-alpine \
            -c 'apk add --no-cache bash git jq && ./gradlew --no-daemon check'
      - name: Transfer JAR outputs for final archive
        id: upload_lint_jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-jars
          path: build/libs/
          if-no-files-found: warn

  publish-artifacts:
    needs: [unit-tests, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish Artifacts
        run: |
          docker run --rm --user root \
            -e APP_ENV \
            --entrypoint sh \
            gradle:8.7.0-jdk17-alpine \
            -c "echo 'Publishing artifacts (placeholder)'"

  archive-artifacts:
    needs: [build, unit-tests, lint, publish-artifacts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Restore build outputs when available
        if: ${{ always() && needs.build.outputs.build_artifact_url != '' }}
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
      - name: Collect unit-test JAR outputs when available
        if: ${{ always() && needs.unit-tests.outputs.jars_artifact_url != '' }}
        uses: actions/download-artifact@v4
        with:
          name: unit-jars
          path: build/libs
      - name: Collect lint JAR outputs when available
        if: ${{ always() && needs.lint.outputs.jars_artifact_url != '' }}
        uses: actions/download-artifact@v4
        with:
          name: lint-jars
          path: build/libs
      - name: Archive JAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-jars
          path: build/libs/*.jar
          if-no-files-found: error
