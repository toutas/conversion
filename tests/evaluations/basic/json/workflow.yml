name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  APP_ENV: ci

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh -xe {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Test
        id: test
        run: ./gradlew --no-daemon test

      - name: Publish JUnit results
        if: ${{ always() && steps.test.outcome != 'skipped' && steps.test.outcome != '' }}
        uses: dorny/test-reporter@v2
        with:
          name: JUnit test results
          path: 'build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: 'true'
          fail-on-empty: 'true'

      - name: Archive JAR artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-jars
          path: 'build/libs/*.jar'
          if-no-files-found: error
